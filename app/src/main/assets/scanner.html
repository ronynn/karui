<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif;
    color: #EBDBB2;
  }
  video {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
    background: #000;
  }
  video.playing { display: block; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  #frame {
    width: 70vmin; height: 70vmin;
    border: 2px solid #FABD2F;
    border-radius: 14px;
    opacity: 0;
    transition: opacity .3s;
  }
  #frame.visible { opacity: 1; }
  #status {
    position: absolute;
    top: calc(50% - 35vmin - 44px);
    width: 100%; text-align: center;
    color: #FABD2F; font-size: 18px; font-weight: 600;
    text-shadow: 0 2px 8px #000;
  }
  #hint {
    position: absolute;
    bottom: calc(50% - 35vmin - 30px);
    width: 100%; text-align: center;
    color: #EBDBB2; font-size: 13px; opacity: .85;
    text-shadow: 0 2px 8px #000;
  }
  #status.saved { color: #B8BB26; }
  #status.error { color: #FB4934; }

  /* Both floating buttons — blur + semi-transparent + border */
  #close, #torch {
    position: fixed;
    top: 56px;                       /* clears status bar + margin */
    width: 48px; height: 48px;
    border-radius: 24px;
    border: 1px solid rgba(235, 219, 178, 0.15);
    color: #EBDBB2;
    font-size: 22px;
    cursor: pointer;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    line-height: 1;
    background: rgba(40, 40, 40, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    -webkit-tap-highlight-color: transparent;
  }
  #close { right: 16px; }
  #torch {
    left: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
  }
  #close:active, #torch:active {
    background: rgba(80, 73, 69, 0.7);
  }
  #torch.on {
    background: rgba(250, 189, 47, 0.85);
    color: #282828;
    border-color: transparent;
  }

  /* Preview box — shows decoded text before saving */
  #preview {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 120px;
    max-height: 120px;
    overflow-y: auto;
    background: rgba(40, 40, 40, 0.95);
    border: 1px solid #504945;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.4;
    color: #EBDBB2;
    z-index: 8;
    display: none;
    -webkit-user-select: text; user-select: text;
    word-break: break-all;
  }
  #preview.visible { display: block; }
  #preview-label {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 244px;
    font-size: 11px;
    letter-spacing: .5px;
    color: #928374;
    z-index: 8;
    display: none;
  }
  #preview-label.visible { display: block; }

  #controls {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px) + 40px);
    display: none;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: linear-gradient(to top, rgba(0,0,0,.9), transparent);
    z-index: 10;
  }
  #controls.visible { display: flex; }
  #controls button {
    background: #3C3836; color: #EBDBB2;
    border: none; padding: 12px 20px;
    border-radius: 10px; font-size: 14px; font-weight: 600;
    letter-spacing: .5px; cursor: pointer;
    min-width: 90px;
  }
  #controls button:active { background: #504945; }
  #btn-save { background: #FABD2F; color: #282828; }
  #btn-save:active { background: #D79921; }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #EBDBB2; font-size: 14px;
    background: #000;
    z-index: 5;
    text-align: center;
    padding: 20px;
    white-space: pre-line;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<button id="close" onclick="closeApp()">×</button>
<button id="torch" onclick="toggleTorch()" title="Torch">T</button>

<video id="v" autoplay playsinline webkit-playsinline disableremoteplayback muted></video>
<canvas id="c" style="display:none"></canvas>

<div id="loading">Starting camera…</div>

<div id="overlay">
  <div id="frame">
    <div id="status"></div>
    <div id="hint"></div>
  </div>
</div>

<div id="preview-label">SCANNED TEXT</div>
<div id="preview"></div>

<div id="controls">
  <button id="btn-save" onclick="save()">SAVE</button>
  <button id="btn-copy" onclick="copy()">COPY</button>
  <button id="btn-rescan" onclick="rescan()">SCAN AGAIN</button>
</div>

<script src="jsqr.min.js"></script>
<script>
  const video     = document.getElementById('v');
  const canvas    = document.getElementById('c');
  const ctx       = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl  = document.getElementById('status');
  const hintEl    = document.getElementById('hint');
  const frameEl   = document.getElementById('frame');
  const controls  = document.getElementById('controls');
  const loadingEl = document.getElementById('loading');
  const previewEl = document.getElementById('preview');
  const previewLabel = document.getElementById('preview-label');
  const btnSave   = document.getElementById('btn-save');
  const btnCopy   = document.getElementById('btn-copy');
  const btnRescan = document.getElementById('btn-rescan');
  const torchBtn  = document.getElementById('torch');

  let scanning = true;
  let lastScanData = '';
  let lastScanTime = 0;
  let stream = null;
  let torchOn = false;
  let currentPayload = null;

  function setUI(state, message)
  {
    statusEl.className = '';
    controls.classList.remove('visible');
    previewEl.classList.remove('visible');
    previewLabel.classList.remove('visible');
    btnSave.style.display = 'none';
    btnCopy.style.display = 'none';
    btnRescan.style.display = 'none';

    if (state === 'scanning') {
      statusEl.textContent = '';
      hintEl.textContent = 'Point at a Karui QR code';
      frameEl.classList.add('visible');
    } else if (state === 'partial') {
      statusEl.textContent = message;
      hintEl.textContent = 'Point at the next QR code';
      frameEl.classList.add('visible');
    } else if (state === 'ready') {
      statusEl.className = 'saved';
      statusEl.textContent = '✓ ' + message;
      hintEl.textContent = 'Review below, then save or copy';
      controls.classList.add('visible');
      btnSave.style.display = 'inline-block';
      btnCopy.style.display = 'inline-block';
      btnRescan.style.display = 'inline-block';
      frameEl.classList.remove('visible');
    } else if (state === 'error') {
      statusEl.className = 'error';
      statusEl.textContent = '⚠ ' + message;
      hintEl.textContent = '';
      frameEl.classList.remove('visible');
    }
  }

  function showPreview(text)
  {
    currentPayload = text;
    previewEl.textContent = text;
    previewEl.classList.add('visible');
    previewLabel.classList.add('visible');
  }

  function clearPreview()
  {
    currentPayload = null;
    previewEl.textContent = '';
    previewEl.classList.remove('visible');
    previewLabel.classList.remove('visible');
  }

  async function toggleTorch()
  {
    if (!stream) return;
    try
    {
      const track = stream.getVideoTracks()[0];
      if (!track) return;
      const caps = track.getCapabilities();
      if (!caps.torch) { torchBtn.style.display = 'none'; return; }
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('on', torchOn);
    }
    catch (e)
    {
      torchBtn.style.display = 'none';
    }
  }

  function stopStream()
  {
    if (stream) {
      try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      stream = null;
    }
  }

  async function start()
  {
    if (typeof jsQR !== 'function') {
      loadingEl.textContent =
        'QR library not loaded.\n\n' +
        'Place jsQR.js (or minified) in app/src/main/assets/ and rename to jsqr.min.js';
      setUI('error', 'jsqr.min.js missing');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      loadingEl.textContent = 'This device does not support camera access in WebView.';
      setUI('error', 'No camera support');
      return;
    }

    try
    {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });

      video.srcObject = stream;
      video.removeAttribute('controls');
      video.controls = false;

      const track = stream.getVideoTracks()[0];
      if (track) {
        const caps = track.getCapabilities();
        if (!caps.torch) torchBtn.style.display = 'none';
      }

      video.addEventListener('playing', () =>
      {
        video.classList.add('playing');
        loadingEl.classList.add('hidden');
        setUI('scanning', '');
        requestAnimationFrame(tick);
      }, { once: true });

      await video.play();
    }
    catch (e)
    {
      loadingEl.textContent =
        'Could not start camera.\n\n' +
        (e.name || 'Error') + ': ' + (e.message || 'unknown');
      setUI('error', 'Camera failed');
    }
  }

  function tick()
  {
    if (!scanning) { requestAnimationFrame(tick); return; }

    if (video.readyState >= 2 && video.videoWidth > 0) {
      const w = video.videoWidth, h = video.videoHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      try {
        ctx.drawImage(video, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) {
          const now = Date.now();
          if (code.data !== lastScanData || now - lastScanTime > 1500) {
            lastScanData = code.data;
            lastScanTime = now;
            handleScan(code.data);
          }
        }
      } catch (e) {
        setUI('error', 'Decode error: ' + e.message);
        scanning = false;
      }
    }
    requestAnimationFrame(tick);
  }

  function handleScan(text)
  {
    let result;
    try { result = JSON.parse(Android.onScan(text)); }
    catch (e) { setUI('error', 'Bridge error'); return; }

    if (result.type === 'chunk') {
      setUI('partial', 'Scanned ' + result.received + '/' + result.total);
    } else if (result.type === 'ready') {
      scanning = false;
      setUI('ready', result.summary);
      showPreview(text);
    } else if (result.type === 'error') {
      setUI('error', result.message);
      setTimeout(() => { if (scanning) setUI('scanning', ''); }, 1800);
    }
  }

  function save()
  {
    if (!currentPayload) return;
    const r = JSON.parse(Android.save());
    if (r.ok) {
      setUI('ready', 'Saved — closing…');
      setTimeout(() => { try { Android.close(); } catch (e) {} }, 600);
    } else {
      setUI('error', r.message || 'Save failed');
    }
  }

  function copy()
  {
    if (!currentPayload) return;
    const r = JSON.parse(Android.copy());
    if (r.ok) {
      statusEl.textContent = '✓ Copied to clipboard';
      statusEl.className = 'saved';
    }
  }

  function rescan()
  {
    Android.rescan();
    lastScanData = '';
    scanning = true;
    clearPreview();
    setUI('scanning', '');
  }

  function closeApp()
  {
    stopStream();
    try { Android.close(); } catch (e) {}
  }

  window.addEventListener('pagehide', stopStream);
  window.addEventListener('beforeunload', stopStream);

  start();
</script>
</body>
</html>
