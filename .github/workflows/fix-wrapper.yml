name: Fix Gradle Wrapper (8.4)

on:
  workflow_dispatch:  # Allows manual trigger

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java & Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate New Gradle Wrapper
        run: |
         GRADLE_VERSION="8.4"
         GRADLE_SHA256="3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae"
    
         # Run inside your repo so settings.gradle is found
         gradle wrapper --gradle-version $GRADLE_VERSION --gradle-distribution-sha256-sum $GRADLE_SHA256

      - name: Upload Gradle Wrapper JAR
        uses: actions/upload-artifact@v5
        with:
          name: gradle-wrapper.jar
          path: gradle/wrapper/gradle-wrapper.jar
          retention-days: 7

      - name: Upload Gradle Wrapper Properties
        uses: actions/upload-artifact@v5
        with:
          name: gradle-wrapper.properties
          path: gradle/wrapper/gradle-wrapper.properties
          retention-days: 7
