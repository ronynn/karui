name: Export Matching Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  build-wrapper-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle 8.4 wrapper files
        run: |
          ./gradlew wrapper --gradle-version 8.4 --gradle-distribution-sha256-sum 3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae

      - name: Bundle wrapper files
        run: |
          mkdir -p output_wrapper
          cp gradle/wrapper/gradle-wrapper.jar output_wrapper/
          cp gradle/wrapper/gradle-wrapper.properties output_wrapper/

      - name: Upload wrapper files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.4-wrapper-files
          path: output_wrapper/